<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word list · zh-immerse</title>
  <link rel="stylesheet" href="vocab.css">
</head>
<body>
  <main>
    <header>
      <h1>Word list <span class="zh">词汇</span></h1>
      <p id="summary" class="muted"></p>
      <p class="muted"><a href="../mywords/mywords.html">My words</a>: the words the 我的 level swaps into Chinese.</p>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="lookups" aria-selected="true">Looked up <span id="countLookups" class="pill">0</span></button>
      <button role="tab" data-tab="saved" aria-selected="false">Saved <span id="countSaved" class="pill">0</span></button>
      <button role="tab" data-tab="reports" aria-selected="false">Reported swaps <span id="countReports" class="pill">0</span></button>
    </nav>

    <section id="wordBar" class="toolbar">
      <input id="query" type="search" placeholder="Search word, pinyin or meaning" aria-label="Search">
      <label>Sort
        <select id="sort">
          <option value="count">Most looked up</option>
          <option value="recent">Most recent</option>
          <option value="first">Newest words</option>
        </select>
      </label>
      <label>At least
        <input id="minCount" type="number" min="1" value="1" aria-label="Minimum lookups"> ×
      </label>
      <label>Seen in
        <select id="since">
          <option value="0">All time</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
          <option value="365">Last year</option>
        </select>
      </label>
      <span class="spacer"></span>
      <button id="exportTsv" class="primary">Export for Anki</button>
      <details class="more">
        <summary>Backup</summary>
        <div class="menu">
          <button id="exportJson">Export backup (JSON)</button>
          <label class="button">Import backup…<input id="importJson" type="file" accept="application/json,.json" hidden></label>
          <button id="clearCache">Clear translation cache…</button>
        </div>
      </details>
    </section>
    <section id="reportBar" class="toolbar" hidden>
      <span class="muted">Swaps you flagged with ⚑ Report in the popup.</span>
      <span class="spacer"></span>
      <button id="exportReports" class="primary">Export reports (JSON)</button>
      <button id="clearReports">Clear all…</button>
    </section>

    <p id="exportNote" class="muted note"></p>

    <div id="wordTable">
    <table>
      <thead>
        <tr>
          <th class="star" aria-label="Saved"></th>
          <th>Word</th>
          <th>Pinyin</th>
          <th>Meaning</th>
          <th class="num">Looked up</th>
          <th>Last seen</th>
          <th class="act" aria-label="Delete"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    </div>
    <div id="reports" hidden></div>
    <p id="empty" class="empty" hidden></p>
  </main>
  <script src="../dist/vocab.js"></script>
</body>
</html>
